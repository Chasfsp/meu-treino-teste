<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Treino</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="fotos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800;1,900&family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0B0B0B; --hdr:rgba(11,11,11,.92); --panel:#161616; --panel2:#222222; --hero:linear-gradient(135deg,#1E1E1E,#141414);
  --line:#262626; --text:#FFFFFF; --muted:#BDBDBD; --orange:#FF6A00; --on-orange:#1A0E05; --peach:#FF8A3D; --tile:#2A1708; --pill-bg:#2A1708;
  --green:#46C78A; --red:#FF7777; --input:#101010; --input-line:#3A3A3A; --done-bg:#183626; --done-line:#43B879; --done-text:#A9EFC5; --lock-bg:#16261D;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0B0B0B; --hdr:rgba(11,11,11,.92); --panel:#161616; --panel2:#222222; --hero:linear-gradient(135deg,#1E1E1E,#141414);
    --line:#262626; --text:#FFFFFF; --muted:#BDBDBD; --orange:#FF6A00; --on-orange:#1A0E05; --peach:#FF8A3D; --tile:#2A1708; --pill-bg:#2A1708;
    --green:#46C78A; --red:#FF7777; --input:#101010; --input-line:#3A3A3A; --done-bg:#183626; --done-line:#43B879; --done-text:#A9EFC5; --lock-bg:#16261D;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101010; --hdr:rgba(17,17,17,.92); --panel:#1D1D1D; --panel2:#272727; --hero:linear-gradient(135deg,#292929,#1B1B1B);
  --line:#353535; --text:#F4F4F4; --muted:#A9A9A9; --orange:#FF6900; --on-orange:#1A1009; --peach:#F5A486; --tile:#3A2418; --pill-bg:#3B281E;
  --green:#46C78A; --red:#FF7777; --input:#111111; --input-line:#454545; --done-bg:#254B37; --done-line:#43B879; --done-text:#A9EFC5; --lock-bg:#1D3328;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px); -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--bg); color:var(--text); font:15px/1.45 var(--f); }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--hdr); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; border:0; background:none; -webkit-tap-highlight-color:transparent; }
a{ color:var(--peach); }
:focus-visible{ outline:2px solid var(--orange); outline-offset:2px; }
[hidden]{ display:none !important; }

.app{ max-width:560px; margin:0 auto; padding-bottom:calc(96px + env(safe-area-inset-bottom,0px)); }
body.foco .app{ padding-bottom:160px; }
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:16px 18px 12px; background:var(--hdr); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
.brand{ font-weight:850; letter-spacing:.08em; font-size:19px; }
.brand span{ color:var(--orange); }
.eyebrow{ font-size:11px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase; }
.content{ padding:18px; }

.hero{ background:var(--hero); border:1px solid var(--line); border-radius:22px; padding:20px; margin-bottom:14px; }
.hero h1{ font-size:29px; line-height:1.12; margin:7px 0; font-weight:800; }
.hero p{ color:var(--muted); margin:0 0 16px; }
.btn{ background:var(--orange); color:var(--on-orange); font-weight:750; border-radius:13px; padding:12px 16px; min-height:46px; }
.btn.secondary{ background:var(--panel2); color:var(--text); border:1px solid var(--line); }
.btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--text); }
.btn.small{ padding:8px 12px; font-size:13px; min-height:38px; }
.btn.full{ width:100%; }
.btn:disabled{ opacity:.45; cursor:default; }
.lnk{ color:var(--peach); text-decoration:underline; text-underline-offset:3px; font-weight:600; min-height:40px; padding:0 2px; }
.lnk.perigo{ color:var(--red); }
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.between{ justify-content:space-between; }
.grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.card{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:15px; margin-bottom:12px; }
.grid > .card{ margin-bottom:0; }
.stat{ font-size:25px; font-weight:800; margin:4px 0; font-variant-numeric:tabular-nums; }
.muted{ color:var(--muted); }
.smalltxt{ font-size:12px; color:var(--muted); }
h2{ font-size:21px; margin:8px 0 14px; font-weight:750; }
h3{ font-size:16px; margin:0 0 7px; font-weight:700; }
p{ margin:0 0 8px; }
.sectionhead{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:22px 0 10px; }
.sectionhead h2{ margin:0; }
.pill{ display:inline-flex; align-items:center; background:var(--pill-bg); color:var(--peach); padding:5px 9px; border-radius:99px; font-size:11px; font-weight:700; }
.pill.ok{ background:var(--done-bg); color:var(--done-text); }
.alerta{ font-size:13px; border-left:3px solid var(--orange); padding:6px 10px; margin:12px 0 0; background:var(--panel2); border-radius:0 8px 8px 0; }
.aviso{ font-size:12px; color:var(--muted); border-left:3px solid var(--red); padding:4px 10px; margin:8px 0; }

.workout{ display:flex; align-items:center; gap:12px; }
.letter{ width:46px; height:46px; display:grid; place-items:center; border-radius:14px; background:var(--tile); color:var(--peach); font-weight:900; font-size:20px; flex-shrink:0; }
.workout-info{ flex:1; min-width:0; }
.workout-info strong{ display:block; }
.feito-em{ color:var(--green); font-size:12px; font-weight:700; margin-top:5px; }
details.lista-ex{ margin-top:10px; font-size:14px; }
details.lista-ex summary{ color:var(--peach); cursor:pointer; font-weight:600; min-height:32px; display:flex; align-items:center; }
details.lista-ex ul{ list-style:none; padding:0; margin:6px 0 0; }
details.lista-ex li{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid var(--line); }
details.lista-ex li span:last-child{ color:var(--muted); white-space:nowrap; }
.shortcut{ display:block; width:100%; text-align:left; color:var(--text); }
.shortcut .ico{ font-size:24px; line-height:1.2; margin-bottom:4px; }

.progress{ height:7px; background:var(--panel2); border-radius:20px; overflow:hidden; }
.progress span{ display:block; height:100%; background:var(--orange); width:0; transition:width .3s ease; }
.progress span.cheio{ background:var(--green); }
.barras{ display:grid; gap:9px; margin-top:10px; }
.barra-g{ display:grid; grid-template-columns:120px 1fr 32px; gap:10px; align-items:center; font-size:13px; }
.barra-g .bg-val{ font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }

/* sessão */
.exercise{ padding:15px; background:var(--panel); border:1px solid var(--line); border-radius:17px; margin:11px 0; }
.exercise.done{ border-color:var(--done-line); }
.ex-cab{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
.exercise-title{ font-weight:750; font-size:16px; }
.ex-cont{ font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
.exercise.done .ex-cont{ color:var(--done-text); }
.exercise-meta{ font-size:12px; color:var(--muted); margin:3px 0 8px; }
.exercise-details{ font-size:13px; color:var(--muted); margin:0 0 8px; }
.ultima{ font-size:13px; background:var(--panel2); border-radius:9px; padding:6px 10px; margin:0 0 6px; }
.sug{ font-size:13px; border-left:3px solid var(--line); padding:3px 10px; margin:0 0 10px; }
.sug-subir{ border-color:var(--green); }
.sug-reduzir{ border-color:var(--red); }
.setcab,.setrow{ display:grid; grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) auto auto; gap:6px; align-items:center; }
.setcab{ font-size:11px; color:var(--muted); }
.setrow{ margin:6px 0; }
.setrow .sn{ font-size:12px; color:var(--muted); font-weight:700; }
.setrow input{ width:100%; min-width:0; min-height:44px; background:var(--input); border:1px solid var(--input-line); border-radius:9px; padding:8px; text-align:center; font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; }
.setrow input:focus{ border-color:var(--orange); outline:none; }
.setrow input.locked{ background:var(--lock-bg); border-color:var(--done-line); color:var(--done-text); }
.set-rest{ background:var(--tile); color:var(--peach); border:1px solid transparent; border-radius:9px; padding:0 9px; min-height:44px; font-size:12px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
.validate-set{ background:var(--panel2); color:var(--muted); border:1px solid var(--line); border-radius:9px; min-width:46px; min-height:44px; font-size:18px; font-weight:800; }
.validate-set[aria-pressed="true"]{ background:var(--done-bg); color:var(--done-text); border-color:var(--done-line); }
.add-set{ background:transparent; color:var(--peach); border:1px dashed var(--peach); border-radius:10px; padding:9px 12px; font-weight:800; min-height:42px; margin-top:4px; }
.rf{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--muted); }
.rf button{ min-width:40px; min-height:36px; border-radius:9px; border:1px solid var(--line); background:var(--panel2); font-weight:700; color:var(--text); }
.rf button[aria-pressed="true"]{ background:var(--orange); color:var(--on-orange); border-color:transparent; }
.complete-exercise{ width:100%; margin-top:10px; min-height:42px; border:1px solid var(--line); border-radius:9px; background:var(--panel2); font-weight:650; }
.complete-exercise.done{ background:var(--done-bg); border-color:var(--done-line); color:var(--done-text); }
.commentbox{ margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
.commentbox textarea,.field input,.field select,.field textarea,.search{ width:100%; background:var(--input); border:1px solid var(--input-line); border-radius:10px; padding:10px; min-height:44px; outline:none; font-size:16px; }
.commentbox textarea:focus,.field input:focus,.field select:focus,.field textarea:focus,.search:focus{ border-color:var(--orange); }
.fala{ display:flex; align-items:center; gap:8px; margin-top:6px; }
.fala button{ color:var(--peach); font-weight:700; font-size:13px; min-height:36px; padding:0 4px; }
.fala button[aria-pressed="true"]{ color:var(--red); }
.complete-session{ width:100%; min-height:48px; margin-top:14px; border:1px solid var(--orange); border-radius:9px; background:transparent; color:var(--peach); font-weight:750; }
.complete-session.done{ background:var(--done-bg); border-color:var(--done-line); color:var(--done-text); }
.fields{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.field{ display:block; }
.field label,.field > span{ display:block; color:var(--muted); font-size:11px; margin:0 0 5px; }
.field.larga{ grid-column:1 / -1; }
.bloqueado{ opacity:.5; pointer-events:none; }
.timer{ font-size:40px; font-weight:800; font-variant-numeric:tabular-nums; }
.timer-card{ margin-top:12px; background:var(--panel2); text-align:center; border-radius:14px; padding:16px; }
.timer-card[data-fase="forte"]{ box-shadow:inset 0 4px 0 var(--orange); }
.esforco{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.esforco button{ min-height:46px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); font-weight:650; font-size:13px; }
.esforco button[aria-pressed="true"]{ background:var(--orange); color:var(--on-orange); border-color:transparent; }

/* histórico e calendário */
details.hist summary{ cursor:pointer; list-style:none; }
details.hist summary::-webkit-details-marker{ display:none; }
details.hist[open] summary strong{ color:var(--peach); }
.hist-ex{ padding:10px 0; border-top:1px solid var(--line); font-size:14px; }
.hist-ex em{ display:block; font-style:normal; color:var(--red); font-size:13px; }
.cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:14px; }
.calhead{ color:var(--muted); text-align:center; font-size:10px; padding:5px 0; }
.calcell{ position:relative; border-radius:10px; background:var(--panel2); border:1px solid var(--line); padding:8px 2px 12px; font-size:12px; min-height:40px; }
.calcell.vazio{ visibility:hidden; }
.calcell.today{ border-color:var(--orange); }
.calcell.selected{ background:var(--tile); border-color:var(--orange); }
.calcell.has-event::after{ content:""; position:absolute; bottom:4px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:var(--green); }

/* gráficos */
.chart{ display:flex; align-items:flex-end; gap:9px; height:130px; padding:10px 4px 0; }
.barwrap{ flex:1; text-align:center; min-width:0; }
.bar{ background:var(--orange); border-radius:7px 7px 2px 2px; min-height:4px; }
.barlabel{ font-size:10px; color:var(--muted); margin-top:5px; font-variant-numeric:tabular-nums; }
.graf{ width:100%; height:auto; display:block; margin:8px 0; }
.graf .eixo{ stroke:var(--line); stroke-width:1; }
.graf .ln{ fill:none; stroke:var(--orange); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
.graf .pt{ fill:var(--panel); stroke:var(--orange); stroke-width:2; }
.graf .tx{ fill:var(--muted); font:500 11px var(--f); }
.linha-info{ display:flex; justify-content:space-between; gap:10px; padding:4px 0; }

/* assistente */
.ia{ white-space:pre-wrap; font-size:15px; line-height:1.55; background:var(--panel2); border-radius:12px; padding:12px; margin-top:12px; }
.ia:empty{ display:none; }
.seg{ display:inline-grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--panel2); border-radius:11px; padding:3px; }
.seg button{ min-height:36px; padding:0 14px; border-radius:9px; font-weight:650; font-size:13px; color:var(--muted); }
.seg button[aria-pressed="true"]{ background:var(--orange); color:var(--on-orange); }

/* cabeçalho com voltar */
.top .voltar{ display:inline-flex; align-items:center; gap:4px; color:var(--orange); font-weight:700; font-size:15px; min-height:40px; padding:0 4px; }
.top .titulo{ position:absolute; left:50%; transform:translateX(-50%); font-weight:750; font-size:15px; white-space:nowrap; max-width:48%; overflow:hidden; text-overflow:ellipsis; }
.top .info{ font-size:12px; color:var(--muted); white-space:nowrap; }
/* exercício: foto, vídeo, sugestões, dificuldade */
.ex-topo{ display:flex; gap:10px; }
.foto{ width:64px; height:64px; flex-shrink:0; border-radius:10px; border:1px dashed var(--input-line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--muted); font-size:11px; overflow:hidden; cursor:pointer; background:var(--panel2); padding:0; }
.foto img{ width:100%; height:100%; object-fit:cover; display:block; }
.foto.tem{ border-style:solid; border-color:var(--line); }
.foto svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linejoin:round; }
.ex-info{ flex:1; min-width:0; }
button.btn-video{ background:transparent; cursor:pointer; }
.btn-video{ display:inline-flex; align-items:center; gap:5px; margin-top:6px; font-size:12px; font-weight:650; color:var(--text); border:1px solid var(--line); border-radius:9px; padding:6px 10px; text-decoration:none; min-height:32px; }
.nota-ini{ font-size:12px; color:var(--muted); background:var(--panel2); border-radius:9px; padding:6px 9px; margin:10px 0 0; }
.setrow input.sug{ border-style:dashed; color:var(--muted); font-weight:500; }
.acoes-serie{ display:grid; grid-template-columns:1fr 1fr 1.6fr; gap:8px; margin-top:6px; }
.acoes-serie .add-set{ margin-top:0; }
.validar-todas{ border:1px solid var(--line); border-radius:10px; background:var(--panel2); font-weight:650; min-height:42px; font-size:13px; }
.dif-bloco{ border-top:1px solid var(--line); margin-top:12px; padding-top:10px; }
.dif{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.dif button{ min-height:42px; border-radius:9px; border:1px solid var(--line); background:var(--panel2); font-weight:650; font-size:14px; }
.dif button[aria-pressed="true"]{ background:var(--orange); color:var(--on-orange); border-color:transparent; }
.enviado{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:12px; font-size:13px; background:var(--done-bg); color:var(--done-text); border-radius:9px; padding:8px 10px; }
.enviado button{ color:inherit; text-decoration:underline; font-size:13px; font-weight:600; min-height:32px; flex-shrink:0; }
/* começar do zero */
.opcao{ display:block; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-top:8px; }
.opcao[aria-pressed="true"]{ border:2px solid var(--orange); padding:13px; }
.op-cab{ display:flex; align-items:center; gap:10px; }
.op-nome{ flex:1; font-weight:750; font-size:16px; }
.radio{ width:20px; height:20px; border-radius:50%; border:2px solid var(--input-line); flex-shrink:0; }
.opcao[aria-pressed="true"] .radio{ border-color:var(--orange); background:var(--orange); box-shadow:inset 0 0 0 3px var(--panel); }
.aviso-arq{ display:flex; gap:8px; font-size:12px; color:var(--muted); background:var(--panel2); border-radius:10px; padding:9px 10px; margin-top:12px; }
.foto-grande{ width:100%; max-height:60vh; object-fit:contain; border-radius:12px; background:var(--panel2); display:block; }

/* navegação inferior */
.bottom{ position:fixed; bottom:0; left:0; right:0; z-index:10; display:flex; justify-content:center; background:var(--hdr); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid var(--line); }
.nav{ width:min(100%,560px); display:flex; justify-content:space-around; padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px)); }
.nav button{ color:var(--muted); padding:6px 8px; border-radius:14px; min-width:62px; font-size:11px; font-weight:600; display:grid; justify-items:center; gap:2px; }
.nav button svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.nav button.active{ color:var(--orange); background:var(--tile); }

/* descanso, modais, avisos */
#timer{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--panel); border-top:2px solid var(--orange); padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); box-shadow:0 -10px 30px rgba(0,0,0,.25); }
.t-in{ max-width:700px; margin:0 auto; display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; }
.t-rot{ font-size:12px; color:var(--muted); margin:0; text-transform:uppercase; letter-spacing:.1em; }
.t-tempo{ font-size:40px; font-weight:800; line-height:1; margin:2px 0 0; font-variant-numeric:tabular-nums; }
.t-btns{ display:flex; gap:6px; }
.tb{ min-height:44px; min-width:52px; padding:0 10px; border-radius:10px; background:var(--panel2); border:1px solid var(--line); font-weight:700; }
.t-barra{ grid-column:1 / -1; height:6px; border-radius:3px; background:var(--panel2); overflow:hidden; }
.t-fill{ height:100%; width:100%; background:var(--orange); transform-origin:left; }
#timer.acabou .t-tempo{ color:var(--green); }
.modal{ position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:20px; }
.modalbox{ width:min(100%,420px); background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:24px; text-align:center; box-shadow:0 15px 50px rgba(0,0,0,.4); }
.modalbox ul{ text-align:left; margin:10px 0 0; padding-left:20px; }
#toast{ position:fixed; bottom:calc(96px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:12px; z-index:50; box-shadow:0 5px 20px rgba(0,0,0,.3); max-width:calc(100% - 32px); opacity:0; pointer-events:none; transition:opacity .2s ease; font-weight:600; }
#toast.on{ opacity:1; }
body.foco #toast{ bottom:calc(130px + env(safe-area-inset-bottom,0px)); }

@media (min-width:760px){
  .content{ padding:25px 28px; }
  .hero{ padding:28px; }
  .hero h1{ font-size:36px; }

  let h = `<div style="margin-top:12px"><p class="smalltxt">${esc(nomeTreino(s))}. ${s.esforco ? `Esforço: ${esc(s.esforco)}. ` : (s.rpe != null ? `Esforço ${s.rpe}/10. ` : '')}${c.seg ? `Cardio ${c.modo === 'intervalado' ? 'intercalado' : 'contínuo'}: ${cardioTxt(c.seg)}.` : 'Sem cardio registrado.'}</p>`;
  listaDe(s).forEach(id => {
    const e = s.ex && s.ex[id]; if (!e) return;
    const ok = okSets(e);
    if (!ok.length && !e.desc) return;
    h += `<div class="hist-ex"><strong>${esc(nomeEx(id))}</strong><div class="smalltxt">${ok.length ? esc(fmtSets(ok)) : 'não feito'}${e.dif ? `. ${esc(e.dif)}.` : ''}</div>${e.desc ? `<em>${esc(e.desc)}</em>` : ''}</div>`;
  });
  h += `${c.obs ? `<p class="smalltxt">Cardio: ${esc(c.obs)}</p>` : ''}${s.obs ? `<p>${esc(s.obs)}</p>` : ''}<button class="lnk perigo" data-a="apagar" data-id="${esc(s.id)}">Apagar este treino</button></div>`;
  return h;
}
function entradaHistorico(s) {
  const f = contarFeitas(s), pct = f.total ? Math.round(f.ok / f.total * 100) : 0;
  return `<details class="card hist" ${S.aberto === s.id ? 'open' : ''} data-hist="${esc(s.id)}"><summary><div class="row between"><strong>${dataLonga(s.inicio)} · Treino ${esc(s.treino)}</strong><strong style="color:${pct === 100 ? 'var(--green)' : 'var(--peach)'}">${pct}%</strong></div>
    <div class="progress" style="margin:8px 0 6px"><span class="${pct === 100 ? 'cheio' : ''}" style="width:${pct}%"></span></div><div class="smalltxt">${f.ok}/${f.total} séries concluídas · ${duracao(s)}${s.importado ? ' · app anterior' : ''}</div></summary>${detalhe(s)}</details>`;
}
function calendario() {
  const hoje = new Date(), base = S.cal ? new Date(S.cal + '-01T12:00:00') : new Date(hoje.getFullYear(), hoje.getMonth(), 1, 12);
  const y = base.getFullYear(), m = base.getMonth(), porDia = {};
  validas().forEach(s => { const k = diaLocal(ms(s.inicio)); (porDia[k] = porDia[k] || []).push(s); });
  const primeiro = new Date(y, m, 1).getDay(), dias = new Date(y, m + 1, 0).getDate(), hojeK = diaLocal(Date.now());
  let h = `<div class="card"><div class="row between"><button class="btn ghost small" data-a="cal" data-d="-1" aria-label="Mês anterior">‹</button>
    <strong style="text-transform:capitalize">${base.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}</strong>
    <button class="btn ghost small" data-a="cal" data-d="1" aria-label="Próximo mês">›</button></div><div class="cal">`;
  h += ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(d => `<div class="calhead" aria-hidden="true">${d}</div>`).join('');
  for (let i = 0; i < primeiro; i++) h += `<div class="calcell vazio" aria-hidden="true"></div>`;
  for (let d = 1; d <= dias; d++) {
    const k = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`, n = (porDia[k] || []).length;
    h += `<button class="calcell${k === hojeK ? ' today' : ''}${k === S.diaSel ? ' selected' : ''}${n ? ' has-event' : ''}" data-a="dia" data-k="${k}" aria-label="Dia ${d}${n ? `, ${n} ${n > 1 ? 'treinos' : 'treino'}` : ''}">${d}</button>`;
  }
  h += `</div></div>`;
  if (S.diaSel) {
    const ss = porDia[S.diaSel] || [];
    h += `<div class="card"><h3>${dataISO(S.diaSel)}</h3>${ss.length ? ss.map(x => `<button class="btn secondary full" style="margin-top:6px;text-align:left" data-a="abrir" data-id="${esc(x.id)}">Treino ${esc(x.treino)} — ${esc(nomeTreino(x))}: ${seriesFeitas(x)} séries</button>`).join('') : '<p class="smalltxt">Nenhum treino neste dia.</p>'}</div>`;
  }
  return h;
}

}

/* ----- evolução ----- */
function grafico(pontos, o) {
  if (pontos.length < 2) return `<p class="smalltxt">${esc(o.vazio)}</p>`;
  const W = 320, H = 150, P = { l: 44, r: 10, t: 12, b: 22 };
  const ys = pontos.map(p => p.y), dMin = Math.min(...ys), dMax = Math.max(...ys);
  let yMin = dMin, yMax = dMax; if (yMax === yMin) { yMax += 1; yMin -= 1; }
  const pad = (yMax - yMin) * 0.12; yMin -= pad; yMax += pad;
  const xMin = pontos[0].x, xMax = pontos[pontos.length - 1].x;
  const X = x => P.l + (xMax === xMin ? (W - P.l - P.r) / 2 : (x - xMin) / (xMax - xMin) * (W - P.l - P.r));
  const Y = y => P.t + (1 - (y - yMin) / (yMax - yMin)) * (H - P.t - P.b), f = v => v.toFixed(1);
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.rotulo)}">
    <line x1="${P.l}" y1="${H - P.b}" x2="${W - P.r}" y2="${H - P.b}" class="eixo"/>
    <polyline points="${pontos.map(p => `${f(X(p.x))},${f(Y(p.y))}`).join(' ')}" class="ln"/>
    ${pontos.map(p => `<circle cx="${f(X(p.x))}" cy="${f(Y(p.y))}" r="3.5" class="pt"/>`).join('')}
    <text x="${P.l - 6}" y="${f(Y(dMax) + 4)}" text-anchor="end" class="tx">${esc(o.fmt(dMax))}</text>
    <text x="${P.l - 6}" y="${f(Y(dMin) + 4)}" text-anchor="end" class="tx">${esc(o.fmt(dMin))}</text>
    <text x="${P.l}" y="${H - 6}" class="tx">${dataCurta(xMin)}</text><text x="${W - P.r}" y="${H - 6}" text-anchor="end" class="tx">${dataCurta(xMax)}</text></svg>`;
}

function gerarRelatorio(dias) {

  L.push(`Meu Treino: relatório de ${dias} dias`, `Período: ${dataLonga(ini)} a ${dataLonga(agora)}`);

  const fmtMed = m => [['peso', 'peso', ' kg'], ['cintura', 'cintura', ' cm'], ['gordura', 'gordura', '%'], ['magra', 'massa magra', ' kg'], ['muscular', 'massa muscular', ' kg'], ['visceral', 'gordura visceral', '']].filter(([k]) => m[k] != null).map(([k, n, u]) => `${n} ${numBR1(m[k])}${u}`).join(', ');
  const meds = medidasTodas().filter(m => Date.parse(m.data + 'T12:00:00') >= ini - 270 * 864e5);

  L.push('', 'Evolução por exercício (primeira e última sessão do período):');
  [...new Set([...P.ordem.flatMap(t => itensTreino(t).map(x => x.id)), ...ss.flatMap(listaDe)])].forEach(id => {
    const regs = ss.map(s => ({ d: s.inicio, sets: okSets(s.ex && s.ex[id]), dif: s.ex && s.ex[id] ? s.ex[id].dif : null })).filter(r => r.sets.length);
    if (!regs.length) return;
    const pr = prescricao(id, null), a = regs[0], u = regs[regs.length - 1], difs = regs.map(r => r.dif).filter(Boolean);
    L.push(`- ${nomeEx(id)} (${pr.min}–${pr.max} reps): ${regs.length === 1 ? `${dataCurta(a.d)} ${fmtSets(a.sets)}` : `${dataCurta(a.d)} ${fmtSets(a.sets)} → ${dataCurta(u.d)} ${fmtSets(u.sets)}`}; ${regs.length} ${regs.length > 1 ? 'sessões' : 'sessão'}; como foi: ${difs.length ? difs.join(', ').toLowerCase() : 'não registrado'}; sugestão do app: ${sugestao(id, pr).tipo}`);
  });

/* ----- fotos dos aparelhos ----- */
function reduzirImagem(arquivo, max) {
  return new Promise(res0 => {
    let feito = false;
    const res = v => { if (!feito) { feito = true; res0(v); } };
    setTimeout(() => res({ blob: arquivo, type: arquivo.type || 'image/jpeg' }), 4000);
    let url;
    try { url = URL.createObjectURL(arquivo); } catch (e) { res({ blob: arquivo, type: arquivo.type || 'image/jpeg' }); return; }
    const img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(b => res(b ? { blob: b, type: 'image/jpeg' } : { blob: arquivo, type: arquivo.type || 'image/jpeg' }), 'image/jpeg', 0.82);
      } catch (e) { res({ blob: arquivo, type: arquivo.type || 'image/jpeg' }); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); res({ blob: arquivo, type: arquivo.type || 'image/jpeg' }); };
    img.src = url;
  });
}

function lerArquivo(arq) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result)); fr.onerror = () => rej(fr.error); fr.readAsText(arq); }); }
function dataBRparaISO(t) { const m = String(t || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : null; }
function tempoParaSeg(t) {
  const v = String(t || '').trim();
  if (/^\d+:\d{2}(:\d{2})?$/.test(v)) return v.split(':').map(Number).reduce((a, x) => a * 60 + x, 0);
  const m = v.match(/(\d+)\s*min/); return m ? Number(m[1]) * 60 : 0;

function idExercicio(nome) {
  const n = normalizar(nome).replace(/\s+/g, ' ').trim();
  if (NOMES_ANTIGOS[n]) return NOMES_ANTIGOS[n];
  return Object.keys(EX).find(id => normalizar(EX[id].nome) === n) || 'x_' + n.replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 40);

/* converte o JSON exportado pelo app anterior ({history, measurements}) em registros do Meu Treino */
function converterAntigo(dados) {

    const iso = dataBRparaISO(h.date); if (!iso) return;
    const plano = String(h.plan || 'X').toUpperCase().slice(0, 1), idx = porDia[iso + plano] || 0;
    porDia[iso + plano] = idx + 1;
    const ex = {}, lista = [];
    (h.items || []).forEach(it => {
      if (!it || !it.name) return;
      const id = idExercicio(it.name);
      let sets;
      if (Array.isArray(it.sets) && it.sets.length) sets = it.sets.map(z => ({ c: num(z.load), r: num(z.reps), ok: !!z.done }));
      else {
        const reps = String(it.reps || '').split('/').map(x => x.trim()).filter(Boolean), cargas = String(it.load || '').split('/').map(x => x.trim());
        sets = reps.map((r, k) => ({ c: num(cargas[k] != null && cargas[k] !== '' ? cargas[k] : cargas[cargas.length - 1]), r: num(r), ok: !!it.done }));
      }
      if (ex[id]) ex[id].sets.push(...sets);
      else { ex[id] = { sets, desc: it.comment || '', rf: null, p: EX[id] ? prescricao(id, null) : { series: sets.length || 3, min: 8, max: 12, rest: 90 } }; if (!EX[id]) ex[id].nome = it.name; lista.push(id); }
    });

    if (typeof c === 'string') cardio.seg = tempoParaSeg(c);
    else if (c && typeof c === 'object') { cardio.modo = /interc|interv/i.test(c.type || '') ? 'intervalado' : 'continuo'; cardio.seg = tempoParaSeg(c.duration); cardio.forte = num(c.running) || 1; cardio.leve = num(c.walking) || 2; cardio.obs = c.note || ''; }
    cardio.acumulado = cardio.seg; cardio.feito = cardio.seg > 0;
    const esf = ESFORCOS.find(([n]) => normalizar(n) === normalizar(h.effort || ''));
    docs.push({ id: `s${iso.replace(/-/g, '')}${plano}${idx}i`, tipo: 'sessao', v: 3, prog: 'app anterior', importado: true, treino: plano, nomeTreino: `Treino ${plano} do app anterior`, regiao: 'misto', lista,
      inicio: new Date(iso + 'T12:00:00').toISOString(), fim: null, status: 'concluido', forcaOk: h.strengthDone !== false, esforco: esf ? esf[0] : null, rpe: ESFORCO_ANTIGO[normalizar(h.effort || '')] ?? null, obs: h.notes || '', ex, cardio });
  });
  (dados.measurements || []).forEach(m => {
    const iso = dataBRparaISO(m.date); if (!iso) return;
    docs.push({ id: `m${iso.replace(/-/g, '')}i`, tipo: 'medida', data: iso, peso: num(m.weight), cintura: num(m.waist), gordura: num(m.fat), obs: 'Importado do app anterior' });

}
function gerarCSV() {
  const cab = ['data', 'treino', 'exercicio', 'serie', 'carga_kg', 'reps', 'validada', 'dificuldade', 'anotacao', 'esforco', 'cardio_min', 'cardio_modo', 'obs_treino'];
  const cel = v => { const t = String(v ?? ''); return /[;"\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const linhas = [cab];
  validas().slice().sort(maisAntigo).forEach(s => listaDe(s).forEach(id => {
    const e = s.ex && s.ex[id]; if (!e) return; const c = s.cardio || {};

function bip(atraso) {

    const t = actx.currentTime + atraso, o = actx.createOscillator(), g = actx.createGain();

}

  $('#t-fill').style.transform = `scaleX(${T.total ? Math.min(1, rest / (T.total * 1000)) : 0})`;

    try { navigator.vibrate && navigator.vibrate([250, 120, 250]); } catch (e) {}

    st[f] = num(el.value); st['m' + f] = true; el.classList.remove('sug');
    for (let j = k + 1; j < ex.sets.length; j++) {
      const sj = ex.sets[j]; if (sj.ok || sj['m' + f]) continue;
      sj[f] = st[f];
      const inp = art.querySelector(`[data-k="${j}"] [data-f="${f}"]`); if (inp) inp.value = f === 'c' ? numBR(sj[f]) : (sj[f] ?? '');
    }
  } else if (el.hasAttribute('data-desc') && art) s.ex[art.dataset.ex].desc = el.value;
  else if (el.hasAttribute('data-obs')) s.obs = el.value;
  else if (el.dataset.cf) s.cardio[el.dataset.cf] = el.dataset.cf === 'obs' ? el.value : num(el.value);
  else return;
  salvarAtual(false);
});
app.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'sel-forca') { S.exForca = el.value; render(); return; }
  if (el.dataset.foto) { const arq = el.files && el.files[0]; if (arq) lerExame(arq, el.dataset.foto); el.value = ''; return; }
  if (el.id === 'arq-import') {
    const arq = el.files && el.files[0]; if (!arq) return;
    let dados;
    try { dados = JSON.parse(await lerArquivo(arq)); } catch (err) { toast('Arquivo inválido'); return; }
    let docs = null, antigo = false;
    if (dados && dados.app === 'meu-treino' && Array.isArray(dados.docs)) docs = dados.docs.filter(d => d && d.id && typeof d.id === 'string');
    else if (dados && (Array.isArray(dados.history) || Array.isArray(dados.measurements))) { docs = converterAntigo(dados); antigo = true; }
    if (!docs || !docs.length) { toast('Esse arquivo não é um backup do Meu Treino'); return; }
    const nS = docs.filter(d => tipoDoc(d) === 'sessao').length, nM = docs.filter(d => d.tipo === 'medida').length;
    if (!await confirmar(antigo ? `Importar ${nS} ${nS === 1 ? 'treino' : 'treinos'} e ${nM} ${nM === 1 ? 'medição' : 'medições'} do app anterior? Importar o mesmo arquivo de novo não duplica nada.` : `Importar ${docs.length} registros? Registros com o mesmo identificador serão substituídos.`, 'Importar', 'Cancelar')) return;
    for (const d of docs) {
      S.apagados.delete(d.id);
      const atual = S.docs[d.id];
      if (atual && d.tipo === 'medida') Object.keys(atual).forEach(k => { if (d[k] == null || d[k] === '') d[k] = atual[k]; });
      await gravarDoc(d);
    }
    salvarApagados(); indexarNomes(); el.value = ''; render(); toast('Importação concluída'); return;
  }
  if (S.page === 'session' && S.atual) salvarAtual(true);
});

document.addEventListener('change', ev => {
  const el = ev.target;
  if (!el.dataset || !el.dataset.fotoEx) return;
  const arq = el.files && el.files[0], id = el.dataset.fotoEx;
  const m = el.closest('.modal'); if (m) m.remove();
  if (arq) enviarFoto(id, arq);
  el.value = '';
});
setInterval(() => { if (S.page === 'session' && S.atual && S.atual.cardio.rodando) atualizarCardioDOM(); }, 250);
setInterval(() => { const i = $('#hdr-info'); if (i && S.page === 'session') i.textContent = `${minutosDecorridos()} min`; }, 20000);

(function inicio() {
  const pedida = HASH_PAGINA[location.hash.slice(1)];
  S.page = pedida && !['onboarding', 'recomecar'].includes(pedida) && (pedida !== 'session' || S.atual) ? pedida : 'home';
  pilha.push(S.page);
  const hash = PAGINAS[S.page][0];
  if (location.hash.slice(1) !== hash) { navegando = true; location.replace('#' + hash); }
})();
render();
if (fotosLocaisOk()) FotosLocais.carregarTodas().catch(() => {});
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
iniciarConta();
if (!window.claude && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
